        <p>当你和我说觉得现在不幸福了，唯一觉得幸福的时刻只有是崽对着笑的时候，其他时候觉得的人生都没有什么意思。当看到这个的时候我就在反思是什么事情为什么会让你有这种感觉，感觉自己一定是哪里做错了，感觉很失败呢。是不是因为你感受不到我的爱了呢，当你觉得自己不幸福了，我自己也很不幸福的哦。所以接下来要做的就是要让我的乖乖可以感受到满满的幸福感。</p>
