        <p>我也很喜欢我们一起闲聊的时间，感觉我们还是有很多很多说不完的话题。在好多好多年以后，我们一定还是很多话聊，不会像一些其他的夫妻可能时间久了就会淡了或者不知道说什么了。因为我们有很相似的人生观和生活价值，还有很多相似的爱好，我觉得这才是我们可以一直有说都说不完的话题主要原因吧，而且每次闲聊的时候都很放松，时间真的一下子就过去了的感觉呢。</p>
